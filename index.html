<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hostile Takeover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07070b;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;height:auto;image-rendering:pixelated;display:block;background:#000}
  body.touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #touch{display:none;position:fixed;inset:0;pointer-events:none;font-family:"Press Start 2P",monospace}
  body.touch #touch{display:block}
  #stick{position:absolute;left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;
         background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
  #btns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:grid;
        grid-template-columns:repeat(3,66px);gap:8px;pointer-events:auto}
  #touch button{width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.45);color:#fff;font:9px "Press Start 2P",monospace;
        background:rgba(0,0,0,.35);touch-action:none;padding:0}
  #touch button.on{background:rgba(255,216,74,.55)}
  #touch .b-punch{background:rgba(220,40,40,.4)} #touch .b-grab{background:rgba(255,60,60,.25)} #touch .b-special{background:rgba(118,255,3,.3)}
  #touch .top{position:absolute;top:calc(10px + env(safe-area-inset-top));width:auto;height:34px;border-radius:17px;padding:0 14px;pointer-events:auto}
  #tstart{left:50%;transform:translateX(-50%)} #tpause{right:calc(12px + env(safe-area-inset-right))} #tgore{left:calc(12px + env(safe-area-inset-left))}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button class="b-special" data-a="special">ROAST</button>
    <button class="b-grab" data-a="grab">GRAB</button>
    <button data-a="jump">JUMP</button>
    <span></span>
    <button data-a="kick">KICK</button>
    <button class="b-punch" data-a="punch">PUNCH</button>
  </div>
  <button class="top" id="tstart" data-a="start">START</button>
  <button class="top" id="tpause" data-a="pause">PAUSE</button>
  <button class="top" id="tgore" data-a="gore">GORE</button>
</div>
<script>
'use strict';
/* =========================================================
   HOSTILE TAKEOVER — a belt-scrolling office brawler
   Starring JANSEN WRONG, leather-jacketed CEO of Clmidia.
   (Fictional characters. Any resemblance is parody.)
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540, FT = 330, FB = 520, PX = 3, GRAV = 0.55;
const FONT = '"Press Start 2P", monospace';
let gore = true;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- input ---------------- */
const keys = {}, pressed = {};
const MAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyJ:'punch', KeyZ:'punch', KeyK:'kick', KeyX:'kick',
  Space:'jump', KeyC:'jump', KeyL:'grab', KeyV:'grab',
  KeyI:'special', KeyB:'special', Enter:'start', KeyP:'pause', Escape:'pause', KeyG:'gore'
};
addEventListener('keydown', e => {
  if (!e.repeat) anyInput = true;
  const a = MAP[e.code]; if (!a) return;
  e.preventDefault(); initAudio();
  if (!keys[a]) pressed[a] = true;
  keys[a] = true;
});
addEventListener('keyup', e => { const a = MAP[e.code]; if (a) { keys[a] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------------- touch controls ---------------- */
function vPress(a) { initAudio(); anyInput = true; if (!keys[a]) pressed[a] = true; keys[a] = true; }
function vRelease(a) { keys[a] = false; }
(function setupTouch() {
  if (!(matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window)) return;
  document.body.classList.add('touch');
  document.querySelectorAll('#touch button').forEach(b => {
    const a = b.dataset.a;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); vPress(a); });
    const up = e => { b.classList.remove('on'); vRelease(a); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null;
  const setDir = (dx, dy) => {
    const r = 70, m = Math.hypot(dx, dy), k = m > r ? r / m : 1;
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
    const dz = 18;
    const nl = dx < -dz, nr = dx > dz, nu = dy < -dz, nd = dy > dz;
    if (nl || nr || nu || nd) anyInput = true;
    keys.left = nl; keys.right = nr; keys.up = nu; keys.down = nd;
  };
  const center = () => { const r = stick.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  stick.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); anyInput = true; sid = e.pointerId; stick.setPointerCapture(sid); const [cx, cy] = center(); setDir(e.clientX - cx, e.clientY - cy); });
  stick.addEventListener('pointermove', e => { if (e.pointerId !== sid) return; const [cx, cy] = center(); setDir(e.clientX - cx, e.clientY - cy); });
  const end = e => { if (e.pointerId !== sid) return; sid = null; setDir(0, 0); };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  // tapping the game screen starts / dismisses demo
  cv.addEventListener('pointerdown', e => { e.preventDefault(); vPress('start'); setTimeout(() => vRelease('start'), 50); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
})();

/* ---------------- audio (synthesized) ---------------- */
let AC = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const n = AC.sampleRate; noiseBuf = AC.createBuffer(1, n, n);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, freq, vol, type = 'lowpass', sweep) {
  if (!AC) return; const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
  if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function tone(dur, f1, f2, vol, type = 'square', delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
const SFX = {
  whiff: () => noise(.08, 2200, .07, 'bandpass'),
  hit: () => { noise(.12, 900, .35); tone(.08, 180, 60, .15); },
  heavy: () => { noise(.2, 600, .5); tone(.15, 140, 40, .25); },
  squish: () => { noise(.25, 700, .45, 'lowpass', 90); tone(.12, 120, 50, .2, 'sine'); },
  rip: () => { noise(.55, 3500, .55, 'bandpass', 250); tone(.45, 420, 70, .2, 'sawtooth'); },
  block: () => tone(.06, 1300, 1100, .08),
  hurt: () => tone(.2, 300, 90, .15),
  thud: () => tone(.12, 90, 40, .25, 'sine'),
  pickup: () => { tone(.08, 600, 900, .1); tone(.08, 900, 1300, .1, 'square', .08); },
  throw: () => noise(.15, 1500, .15, 'bandpass', 400),
  die: () => tone(.5, 220, 40, .18, 'sawtooth'),
  go: () => { tone(.1, 660, 660, .1); tone(.1, 880, 880, .1, 'square', .12); },
  special: () => { [220, 277, 330, 440].forEach((f, i) => tone(.7, f, f * 2, .1, 'sawtooth', i * .06)); noise(.9, 4000, .3, 'lowpass', 200); },
  fanfare: () => { [523, 659, 784, 1046].forEach((f, i) => tone(.25, f, f, .1, 'square', i * .12)); },
  boo: () => { [392, 370, 349, 294].forEach((f, i) => tone(i === 3 ? .7 : .28, f, i === 3 ? f * .9 : f, .12, 'sawtooth', i * .3)); },
  scrub: () => noise(.08, 2500, .05, 'bandpass'),
  splash: () => noise(.3, 1200, .2, 'lowpass', 300),
  crash: () => { noise(.6, 4000, .5, 'highpass'); tone(.3, 900, 200, .1, 'square'); },
  zap: () => { tone(.4, 120, 80, .2, 'sawtooth'); noise(.4, 6000, .25, 'highpass'); tone(.3, 1800, 300, .08, 'square', .05); },
  sob: () => { tone(.25, 520, 380, .05, 'triangle'); tone(.3, 480, 300, .05, 'triangle', .28); },
  splat: () => { noise(.5, 400, .7, 'lowpass', 60); tone(.3, 80, 30, .35, 'sine'); },
  clink: () => { tone(.4, 2600, 2500, .08, 'sine'); tone(.5, 3900, 3800, .05, 'sine', .02); },
  kiss: () => { tone(.15, 900, 1800, .1, 'sine'); tone(.2, 1400, 700, .08, 'sine', .15); },
  pee: () => noise(.12, 5000, .05, 'highpass')
};

/* ---------------- data ---------------- */
const TYPES = {
  player:  { skin:'#e2b48c', hair:'#d6d6d6', top:'#171717', top2:'#2c2c2c', shirt:'#0b0b0b', pants:'#1e1e24', shoe:'#070707', glasses:true, jacket:true, ceo:true },
  intern:  { name:'INTERN', hp:28, spd:2.3, dmg:4, reach:46, skin:'#f0c8a0', hair:'#6b4423', top:'#3f78d0', top2:'#2f5ea8', pants:'#3a4f78', shoe:'#dddddd', lanyard:true, score:100 },
  manager: { name:'MIDDLE MANAGER', hp:48, spd:1.7, dmg:7, reach:50, skin:'#d8a47c', hair:'#3a2a1a', top:'#ececec', top2:'#c4c4c4', pants:'#4a4a52', shoe:'#2a1a10', tie:'#c02828', bald:true, score:200 },
  lawyer:  { name:'LAWYER', hp:70, spd:1.5, dmg:9, reach:56, skin:'#c89070', hair:'#1a1a1a', top:'#1e2a4c', top2:'#141d36', pants:'#1e2a4c', shoe:'#0a0a0a', tie:'#d4a020', briefcase:true, block:.35, score:300 },
  hr:      { name:'HR REP', hp:38, spd:1.8, dmg:6, reach:44, skin:'#f2c6a8', hair:'#e8c860', top:'#b0507a', top2:'#8c3c60', pants:'#3b2b40', shoe:'#5a1a2a', ranged:true, longhair:true, score:250 },
  vp:      { name:'VP OF SYNERGY', hp:240, spd:1.6, dmg:11, reach:60, skin:'#d8a47c', hair:'#b04020', top:'#6a2c8c', top2:'#4e1e6a', pants:'#3a1a4a', shoe:'#111', tie:'#f0e040', boss:true, scale:1.35, score:2000 },
  counsel: { name:'GENERAL COUNSEL', hp:320, spd:1.7, dmg:13, reach:62, skin:'#b88060', hair:'#8a8a8a', top:'#222222', top2:'#111111', pants:'#222222', shoe:'#000', tie:'#a00000', briefcase:true, block:.25, boss:true, scale:1.4, score:3000 },
  chairman:{ name:'CHAIRMAN OF THE BOARD', hp:420, spd:1.8, dmg:15, reach:66, skin:'#e8c0a0', hair:'#f4f4f4', top:'#5a5a62', top2:'#44444a', pants:'#3a3a40', shoe:'#000', tie:'#1a6a3a', bald:true, mustache:true, boss:true, scale:1.5, score:5000 }
};
TYPES.vivian = { name:'ESPIONAGE ALICE', hp:999, spd:2.6, dmg:9, reach:62, skin:'#f0c8a8', hair:'#1a1010', top:'#c0103a', top2:'#900a2a',
                 pants:'#f0c8a8', shoe:'#c0103a', dress:true, longhair:true, lips:true, boss:true, untouchable:true, scale:.94, score:0 };
const FLIRT_MOVES = ['blowkiss', 'wink', 'twirl', 'hairflip', 'beckon'];
const TEASES = ['CATCH, HANDSOME!', 'COME AND GET ME~', 'TICK TOCK, JANSEN~', 'I LIKE A MAN WITH HARDWARE.', 'DON\'T KEEP ME WAITING~'];
const FLIRTS = ['OOH, A GPU? FOR ME?', 'YOU REALLY KNOW HOW TO SCALE.', 'MMM, SO MANY TENSOR CORES...',
                "IS IT HOT IN HERE, OR IS IT THE THERMALS?", 'COME HERE, BIG SPENDER.'];
const TAUNT = {
  intern:'IS THIS PAID?', manager:"LET'S CIRCLE BACK!", lawyer:'OBJECTION!', hr:'THIS GOES IN YOUR FILE!',
  vp:"LET'S SYNERGIZE, JANSEN!", counsel:'I ADVISE AGAINST THIS.', chairman:'THE BOARD HAS VOTED, JANSEN.'
};
const QUIPS = ["YOU'RE FIRED!", 'DOWNSIZED!', 'RESTRUCTURED!', 'LET GO!', 'OFFBOARDED!', 'PIP FAILED!', 'RIGHT-SIZED!', "REORG'D!", 'PTO: PERMANENT', 'ROLE ELIMINATED!', 'SEE HR... OH WAIT'];
const WUSES = { arm:8, keyboard:6, mug:1, chair:1 };
const WNAME = { arm:'SEVERED ARM', keyboard:'MECH KEYBOARD', mug:'COFFEE MUG', chair:'OFFICE CHAIR' };
const TDMG  = { arm:22, keyboard:18, mug:16, chair:34 };

const ATK = {
  jab:   { dur:13, a0:3, a1:6,  r0:10, r1:54, dmg:6,  pose:'punch',  kb:2 },
  cross: { dur:15, a0:4, a1:7,  r0:10, r1:58, dmg:8,  pose:'punch',  kb:3 },
  upper: { dur:24, a0:5, a1:9,  r0:10, r1:58, dmg:12, pose:'punch2', kb:7, down:true },
  kick:  { dur:22, a0:6, a1:10, r0:10, r1:68, dmg:11, pose:'kick',   kb:6, down:true },
  jkick: { dur:999,a0:0, a1:999,r0:0,  r1:66, dmg:14, pose:'jumpkick',kb:7, down:true },
  arm:   { dur:22, a0:7, a1:11, r0:5,  r1:82, dmg:20, pose:'swing',  kb:6, weapon:true },
  kb:    { dur:20, a0:6, a1:10, r0:5,  r1:78, dmg:14, pose:'swing',  kb:5, weapon:true }
};
const COMBO = [ATK.jab, ATK.cross, ATK.upper];

const STAGES = [
  { name:'OFFICE FIGHT', sub:'FLOOR 12: OPEN-PLAN PURGATORY', len:3600,
    th:{ wall:'#cdbf9f', wall2:'#b9ab8b', ceil:'#e8e4da', floor:'#56657a', floor2:'#4b5a6e', base:'#6b5a40', sky:'#8cc4ec', city:'#5d7f9c', door:'#8a6a44' },
    posters:['SYNERGY','MOVE FAST','HUSTLE','Q4 OR DIE','THINK BIG'],
    signs:['CONF RM B','SUPPLY','LEGAL','SERVER RM'],
    items:[[620,'mug'],[1250,'keyboard'],[1700,'donut'],[2200,'chair'],[2600,'mug'],[3000,'donut']],
    waves:[ { at:450,  e:['intern','intern','intern'] },
            { at:1150, e:['intern','manager','hr','intern'] },
            { at:1950, e:['lawyer','manager','manager','intern','hr'] },
            { at:2700, boss:true, e:['vp','intern','manager'] } ] },     // boss slot is re-rolled every time
  { name:'ROMANTIC INTERLUDE', sub:'THE PENTHOUSE', len:960, final:true,
    th:{ wall:'#2a1030', wall2:'#22092a', ceil:'#14060f', floor:'#5a1a3a', floor2:'#4a1030', base:'#d4a020', sky:'#ff7a5a', city:'#5a2a5a', door:'#3a1a2a' },
    posters:['MERGERS','ACQUISITIONS','LUXURY','BUY BUY BUY','HOSTILE BIDS'],
    signs:['PENTHOUSE','SPA','WINE CELLAR','HELIPAD'],
    items:[[300,'gpu'],[700,'gpu']], waves:[] }
];
const BOSSES = ['vp', 'counsel', 'chairman'];
const GPU_GOAL = 5, FINAL_TIME = 30 * 60;

/* ---------------- state ---------------- */
let mode = 'title', S = STAGES[0], P = null, stageIdx = 0, camX = 0, lock = false, waveIdx = 0;
let queue = [], spawnT = 0, enemies = [], parts = [], pops = [], projs = [], items = [], decals = [];
let shake = 0, hitstop = 0, flashA = 0, frame = 0, score = 0, lives = 2, banner = 0, goT = 0, modeT = 0, paused = false;
let splats = [], clearGpus = 0;
let heads = [], fin = null, demo = false, demoT = 0, demoCd = 0, titleIdle = 0, anyInput = false, endKind = '';
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

function newPlayer() {
  return { T:TYPES.player, x:120, y:430, z:0, vx:0, vz:0, face:1, hp:100, maxHp:100, state:'idle', t:0, pose:'idle',
           anim:0, combo:0, comboT:0, inv:0, flash:0, weapon:null, hype:0, hitList:[], atk:null, pend:null };
}
function loadStage(i) {
  stageIdx = i; S = STAGES[i]; camX = 0; lock = false; waveIdx = 0; queue = [];
  enemies = []; parts = []; pops = []; projs = []; decals = []; heads = []; splats = []; fin = null; roastT = 0;
  items = S.items.map(([x, k]) => ({ kind:k, x, y:rnd(FT + 25, FB - 15), uses:WUSES[k] }));
  if (!S.final) S.waves[S.waves.length - 1].e[0] = pick(BOSSES);
  Object.assign(P, { x:120, y:430, z:0, vx:0, vz:0, face:1, state:'idle', t:0, weapon:null, atk:null, inv:60, dc:null, peeing:false, headless:false });
  banner = 200; goT = 0; mode = 'play';
  if (S.final) {
    lock = true;
    const v = makeEnemy('vivian', 1); v.cd = 99999; enemies.push(v);
    fin = { phase:'intro', t:0, given:0, timer:FINAL_TIME, dropT:240, v };
  }
}
function makeEnemy(type, side) {
  const T = TYPES[type];
  return { T, type, x: side < 0 ? camX - 70 : camX + W + 70, y: rnd(FT + 10, FB - 10), z:0, vx:0, vz:0, face:-side,
           hp:T.hp, maxHp:T.hp, state:'enter', t:0, anim:0, cd:rnd(30, 90), flash:0, inv:0, armless:false,
           slot:0, aggro:false, pose:'walk' };
}

/* ---------------- fx helpers ---------------- */
function bloodCol() { return gore ? pick(['#c00000','#a00000','#e01818','#7a0000']) : pick(['#ff4fa3','#4fd1ff','#ffe14f','#7dff6a','#b58cff']); }
const BLOOD = 2.2;   // global gore multiplier
function bleed(x, y, z, dir, n) {
  n = Math.round(n * BLOOD);
  for (let i = 0; i < n; i++)
    parts.push({ x, y, z, vx:dir * rnd(1, 6.5) + rnd(-2, 2), vy:rnd(-1.4, 1.4), vz:rnd(1, 8), life:rnd(50, 100), c:bloodCol(), s:(rnd(2, 6)) | 0 });
  if (n >= 30) wallSplat(x + dir * rnd(10, 60), n);
}
// big blood splatters (with drips) on the back wall
function wallSplat(x, n) {
  if (!gore) return;
  const k = Math.min(4, 1 + (n / 40) | 0);
  for (let i = 0; i < k; i++) {
    const s = { x:x + rnd(-50, 50), y:rnd(150, FT - 60), r:rnd(8, 22), blobs:[], drips:[] };
    for (let b = 0; b < 7; b++) s.blobs.push([rnd(-1.6, 1.6) * s.r, rnd(-1, 1) * s.r * .7, rnd(.2, .55) * s.r]);
    for (let d = 0; d < 4; d++) s.drips.push([rnd(-1, 1) * s.r, 0, rnd(.25, .6), 2 + (Math.random() * 3 | 0)]);
    splats.push(s); if (splats.length > 60) splats.shift();
  }
}
// radial blood explosion (heart stomp)
function bloodBurst(x, y, n) {
  n = Math.round(n * BLOOD);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(2, 10);
    parts.push({ x, y, z:2, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .35, vz:rnd(3, 13), life:rnd(60, 120), c:bloodCol(), s:(rnd(2, 7)) | 0 });
  }
  for (let i = 0; i < 10; i++) addDecal(x + rnd(-70, 70), clamp(y + rnd(-25, 25), FT - 20, H - 4), rnd(6, 22));
  wallSplat(x - 50, 120); wallSplat(x + 50, 120);
}
function shoulder(e) { const sc = e.T.scale || 1; return { x: e.x + e.face * 3 * PX * sc, z: 22 * PX * sc }; }
function spurt(e) {
  const s = shoulder(e);
  for (let i = 0; i < 6; i++)
    parts.push({ x:s.x, y:e.y + 1, z:s.z, vx:e.face * rnd(1, 5), vy:rnd(-.6, .6), vz:rnd(3, 9), life:75, c:bloodCol(), s:3 + (Math.random() * 2 | 0) });
}
function addDecal(x, y, r, c) { if (!gore) return; decals.push({ x, y, r, c:c || pick(['rgba(120,0,0,.8)','rgba(150,0,0,.75)','rgba(95,0,0,.85)']) }); if (decals.length > 320) decals.shift(); }
function neckSpurt(e) {
  const sc = e.T.scale || 1, lying = e.state === 'dead' || e.state === 'down';
  const nx = lying ? e.x - e.face * 28 * PX * sc * .9 : e.x, nz = lying ? 6 : 26 * PX * sc;
  for (let i = 0; i < 5; i++)

      const mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), my = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      p.x += mx * 3.3; p.y += my * 2.3; if (mx) p.face = mx;
      p.pose = (mx || my) ? 'walk' : 'idle';
      if (pr('jump')) { p.state = 'jump'; p.t = 0; p.vz = 10.5; p.jvx = mx * 3.6; p.jvy = my * 1.6; p.atk = null; SFX.whiff(); }
      else if (pr('special') && p.hype >= 100) startSpecial();
      else if (pr('grab')) doGrab();
      else if (pr('punch')) {
        const w = p.weapon;
        if (w && (w.kind === 'arm' || w.kind === 'keyboard')) startAtk(w.kind === 'arm' ? ATK.arm : ATK.kb);
        else if (w) throwWeapon();
        else { p.combo = p.comboT > 0 ? (p.combo + 1) % 3 : 0; startAtk(COMBO[p.combo]); }
      }
      else if (pr('kick')) { const f = !p.weapon && nearestFinishable(); if (f) startHeart(f); else startAtk(ATK.kick); }
      p.pend = null;
      break;
    }
    case 'jump':
      p.x += p.jvx; p.y += p.jvy;
      if (!p.atk && (pressed.kick || pressed.punch)) { p.atk = ATK.jkick; p.hitList = []; SFX.whiff(); }
      p.pose = p.atk ? 'jumpkick' : 'jump';
      if (p.atk) checkPlayerHits();
      if (p.t > 2 && p.z === 0) { p.state = 'idle'; p.atk = null; }
      break;
    case 'atk': {
      const a = p.atk; p.pose = a.pose;
      if (p.t >= a.a0 && p.t <= a.a1) checkPlayerHits();
      if (p.t > a.a0) for (const k of ['punch','kick','grab','jump','special']) if (pressed[k]) p.pend = k;
      if (p.t >= a.dur) { p.state = 'idle'; p.atk = null; p.comboT = 20; }
      break;
    }
    case 'throw': p.pose = 'punch'; if (p.t >= 12) p.state = 'idle'; break;
    case 'pick':  p.pose = 'idle';  if (p.t >= 8) p.state = 'idle'; break;
    case 'hurt':  p.pose = 'hurt';  if (p.t >= 18) p.state = 'idle'; break;
    case 'decap': if (updDecap(p)) { p.state = 'idle'; p.dc = null; p.peeing = false; } break;
    case 'heart': updHeart(p); break;
    case 'victim': break;            // frozen while Vivian works
    case 'cutscene': p.pose = 'idle'; break;
    case 'down':
      p.pose = 'down';
      if (p.headless) break;
      if (p.z === 0 && p.t > 55) {
        if (p.dying) {
          lives--;
          if (lives < 0) { mode = 'over'; modeT = 0; SFX.die(); }
          else {
            p.dying = false; p.hp = p.maxHp; p.state = 'idle'; p.inv = 150;
            pop(p.x, p.y, 110, 'REBOOTED!', '#76ff03', 16);
            for (const e of enemies) if (hittable(e)) { e.state = 'down'; e.t = 0; e.vz = 4; e.vx = (e.x >= p.x ? 1 : -1) * 6; }
          }
        } else { p.state = 'idle'; p.inv = 50; }
      }
      break;
    case 'rip': {
      const e = p.ripT, sc = e.T.scale || 1;
      if (p.t < 20) { e.x = p.x + p.face * 36 * sc; e.y = p.y; e.face = -p.face; e.state = 'ripped'; }
      p.pose = p.t < 20 ? 'rip' : 'idle';
      if (p.t === 1) pop(e.x, e.y, 120 * sc, 'GRAB!', '#fff', 12);
      if (p.t === 7 || p.t === 14) { SFX.hit(); shake = 3; const s = shoulder(e); bleed(s.x, e.y, s.z, p.face, 3); }
      if (p.t === 20) {
        e.armless = true; e.hp = Math.max(1, e.hp - 8); e.state = 'stagger'; e.t = 0; e.vx = p.face * 3;
        if (e.cryLeft > 0) { e.state = 'cry'; e.cryT = Math.max(e.cryLeft, 120); e.cryLeft = 0; }   // keeps sobbing
        const s = shoulder(e); bleed(s.x, e.y, s.z, -p.face, 45);
        addDecal(s.x, e.y + 2, 22);
        SFX.rip(); shake = 12; hitstop = 9;
        pop(p.x, p.y, 130, 'ARM RIPPED!', '#ff3030', 22);
        score += 250; p.hype = Math.min(100, p.hype + 30);
        p.weapon = { kind:'arm', uses:WUSES.arm, top:e.T.top, top2:e.T.top2, skin:e.T.skin, owner:e };
      }
      if (p.t >= 32) { p.state = 'idle'; p.ripT = null; }
      break;
    }
    case 'special':       // the roast
      p.pose = p.t < 20 ? 'idle' : 'roast';
      if (p.t === 20) roastHit();
      if (p.t >= 80) p.state = 'idle';
      break;
  }
  p.y = clamp(p.y, FT, FB);
  p.x = clamp(p.x, camX + 20, Math.min(camX + W - 20, S.len - 20));
  // GPUs are auto-collected by walking over them
  if (['idle','jump','atk','pick'].includes(p.state)) for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.kind === 'gpu' && Math.abs(it.x - p.x) < 34 && Math.abs(it.y - p.y) < 24 && p.z < 30) {
      items.splice(i, 1); p.gpus++; SFX.pickup(); score += 100;
      pop(p.x, p.y, 110, '+1 GPU', '#76ff03', 11);
    }
  }
}

function updAI(e) {
  const T = e.T, sc = T.scale || 1, dx = P.x - e.x, dy = P.y - e.y, adx = Math.abs(dx);
  e.face = dx >= 0 ? 1 : -1;
  if (e.cd > 0) e.cd--;
  const pDown = P.state === 'down' || mode !== 'play';
  let tx, ty;
  if (T.ranged && adx > 70) { tx = P.x - e.face * 250; ty = P.y; }
  else if (e.aggro && !pDown) { tx = P.x - e.face * (T.reach * sc * .72); ty = P.y; }
  else { tx = P.x - e.face * (160 + e.slot * 35); ty = clamp(P.y + ((e.slot % 2) ? 45 : -45), FT, FB); }
  const mx = tx - e.x, my = ty - e.y; let moving = false;
  const spd = T.spd * (e.armless ? .8 : 1);
  if (Math.abs(mx) > 6) { e.x += Math.sign(mx) * Math.min(spd, Math.abs(mx)); moving = true; }
  if (Math.abs(my) > 4) { e.y += Math.sign(my) * Math.min(spd * .7, Math.abs(my)); moving = true; }
  e.pose = moving ? 'walk' : 'idle';
  if (pDown) return;
  if (T.ranged && e.cd <= 0 && Math.abs(dy) < 22 && adx < 560 && adx > 90) { e.state = 'toss'; e.t = 0; e.cd = rnd(110, 170); return; }
  if (T.untouchable && e.cd <= 0 && Math.random() < .006) { e.state = 'tease'; e.t = 0; return; }
  if (T.boss && e.cd <= 0 && adx > 220 && Math.abs(dy) < 30 && Math.random() < .02) { e.state = 'chargewind'; e.t = 0; return; }
  if ((e.aggro || T.ranged) && e.cd <= 0 && adx < T.reach * sc + 8 && Math.abs(dy) < 16) { e.state = 'windup'; e.t = 0; }
}

function updEnemy(e) {
  e.t++; e.anim++; if (e.flash > 0) e.flash--; if (e.inv > 0) e.inv--;
  physics(e);
  const T = e.T, sc = T.scale || 1;
  switch (e.state) {
    case 'enter': e.pose = 'walk'; e.x += e.face * T.spd * 1.4; if (e.x > camX + 50 && e.x < camX + W - 50) e.state = 'idle'; break;
    case 'idle': updAI(e); break;
    case 'windup': e.pose = 'windup'; if (e.t >= (T.boss ? 16 : 22)) { e.state = 'attack'; e.t = 0; e.hitDone = false; } break;
    case 'attack':
      e.pose = 'punch';
      if (!e.hitDone && e.t >= 1 && e.t <= 5) {
        const dx = (P.x - e.x) * e.face;
        if (dx > -5 && dx < T.reach * sc + 10 && Math.abs(P.y - e.y) < 20 && P.z < 35) {
          e.hitDone = true; hurtPlayer(Math.round(T.dmg * (e.armless ? .5 : 1)), e.face, T.boss && Math.random() < .4);
          if (T.untouchable) say(e, pick(['NAUGHTY!', 'TSK TSK, DARLING.', 'TOO SLOW, HANDSOME!']));
        }
      }
      if (e.t >= 16) { e.state = 'idle'; e.cd = rnd(T.boss ? 40 : 60, T.boss ? 80 : 130); }
      break;
    case 'toss':
      e.pose = e.t < 18 ? 'windup' : 'punch';
      if (e.t === 18) { projs.push({ kind:'memo', x:e.x + e.face * 20, y:e.y, z:55, vx:e.face * 6.5, vz:0, owner:'e', dmg:6, life:200, spin:0 }); SFX.throw(); }
      if (e.t >= 30) e.state = 'idle';
      break;
    case 'chargewind': e.pose = 'windup'; if (e.t === 1) say(e, 'HRRAAAGH!'); if (e.t >= 30) { e.state = 'charge'; e.t = 0; e.hitDone = false; } break;
    case 'charge':
      e.pose = 'punch'; e.x += e.face * 8; e.anim += 2;
      if (!e.hitDone && Math.abs(P.x - e.x) < 45 && Math.abs(P.y - e.y) < 24 && P.z < 40) { e.hitDone = true; hurtPlayer(T.dmg + 4, e.face, true); }
      if (e.t >= 45 || e.x < camX + 30 || e.x > camX + W - 30) { e.state = 'idle'; e.cd = 90; }
      break;
    case 'hurt': e.pose = 'hurt'; if (e.t >= 16) e.state = 'idle'; break;
    case 'down': e.pose = 'down'; if (e.z === 0 && e.t > 50) { e.state = 'getup'; e.t = 0; } break;
    case 'getup': e.pose = 'hurt'; e.inv = 2; if (e.t >= 16) { e.state = 'idle'; e.cd = 30; } break;
    case 'ripped': e.pose = 'ripped'; break;
    case 'stagger': e.pose = 'hurt'; if (e.t % 3 === 0) spurt(e); if (e.t >= 60) { e.state = 'idle'; e.cd = 40; } break;
    case 'flirt': {                  // a different playful routine for each GPU
      const move = FLIRT_MOVES[(e.flirtN || 0) % FLIRT_MOVES.length];
      e.pose = move; e.face = P.x >= e.x ? 1 : -1;
      if (move === 'twirl') { e.face = (e.t >> 3) % 2 ? 1 : -1; if (e.t % 8 === 0) hearts(e.x, e.y, 60, 2); }
      if (move === 'blowkiss' && e.t === 34) blowKiss(e);
      if (move === 'wink' && e.t === 20) { pop(e.x + e.face * 20, e.y, 130, '*WINK*', '#ff7ab8', 10); SFX.kiss(); }
      if (move === 'hairflip' && e.t === 15) { for (let i = 0; i < 14; i++) parts.push({ x:e.x - e.face * 14, y:e.y, z:100, vx:rnd(-3, 3), vy:0, vz:rnd(1, 4), life:40, c:pick(['#fff6a0','#ffd84a','#fff']), s:2, float:true }); }
      if (move === 'beckon' && e.t === 25) blowKiss(e);
      if (e.t % 9 === 0) hearts(e.x, e.y, 105, 1);
      if (e.t >= 95) { e.state = 'wander'; e.t = 0; e.goal = { x:rnd(80, W - 80), y:rnd(FT, FB) }; }
      break;
    }
    case 'tease':                    // unprompted blown kiss between attacks
      e.pose = 'blowkiss'; e.face = P.x >= e.x ? 1 : -1;
      if (e.t === 1) say(e, pick(TEASES));
      if (e.t === 34) blowKiss(e);
      if (e.t >= 55) { e.state = 'idle'; e.cd = 40; }
      break;
    case 'cry':                      // roasted: sobbing, defenceless
      e.pose = 'cry'; e.vx *= .8;
      if (e.t % 4 === 0) tears(e);
      if (e.t % 50 === 0 && Math.random() < .5) SFX.sob();
      if (e.t >= (e.cryT || 300)) { e.state = 'idle'; e.cd = 40; }
      break;
    case 'flee': {                   // terrified after a decapitation
      const away = e.x >= P.x ? 1 : -1;
      e.face = -away; e.pose = 'flee';
      const edge = away > 0 ? camX + W - 25 : camX + 25;
      if (Math.abs(edge - e.x) > 8) e.x += away * T.spd * 1.9;
      else e.x += Math.sin(e.t * 1.7) * 1.5;                  // cowering, trembling against the wall
      if (e.t % 40 === 0) e.goalY = rnd(FT, FB);
      if (e.goalY !== undefined) e.y += Math.sign(e.goalY - e.y) * Math.min(1.2, Math.abs(e.goalY - e.y));
      if (e.t % 6 === 0) parts.push({ x:e.x + rnd(-8, 8), y:e.y, z:95 * sc, vx:rnd(-1, 1), vy:0, vz:rnd(1, 2), life:20, c:'#bfe9ff', s:2, tear:true });
      if (e.t >= (e.fleeT || 300)) { e.state = 'idle'; e.cd = 30; }
      break;
    }
    case 'heartless':                // staggering with a hole in the chest, then collapses
      e.pose = 'hurt';
      if (e.t % 2 === 0) chestSpurt(e);
      if (e.t === 1) say(e, pick(['MY... HEART...', 'IS THAT MINE?', 'I NEEDED THAT!']));
      if (e.t >= 30) killEnemy(e, -e.face, { kb:-1.2, heart:true });
      break;
    case 'wander': {
      e.pose = 'walk'; const gx = e.goal.x - e.x, gy = e.goal.y - e.y;
      e.x += Math.sign(gx) * Math.min(3.5, Math.abs(gx)); e.y += Math.sign(gy) * Math.min(2.5, Math.abs(gy));
      e.face = gx >= 0 ? 1 : -1;
      if ((Math.abs(gx) < 6 && Math.abs(gy) < 6) || e.t > 90) { e.state = 'idle'; e.cd = 50; }
      break;
    }
    case 'kiss': break;              // driven by updFinal
    case 'decap':
      if (updDecap(e)) { e.state = 'idle'; e.dc = null; e.peeing = false; mode = 'over'; modeT = 0; endKind = 'vivian'; }
      break;
    case 'dead':
      e.pose = 'down';
      if (e.armless && e.t % 4 === 0 && e.t < 60) spurt(e);
      if (e.headless && e.t % 3 === 0 && e.t < 90) neckSpurt(e);
      if (e.holed && e.t % 4 === 0 && e.t < 70) chestSpurt(e);
      if (gore && e.z === 0 && e.t % 10 === 0 && e.t < 120) addDecal(e.x - e.face * rnd(0, 60) * sc, e.y + rnd(-3, 3), rnd(6, 14) + e.t / 10);
      if (e.z === 0 && e.t > 20) {
        if (!e.puddled) { e.puddled = true; addDecal(e.x - e.face * 40 * sc, e.y, rnd(18, 28) * sc); }
        e.fade = (e.fade ?? 1) - .012;
      }
      break;
  }
  e.y = clamp(e.y, FT, FB);
  if (e.state !== 'enter' && e.state !== 'dead') e.x = clamp(e.x, camX + 15, camX + W - 15);
}

function updWaves() {
  if (fin) { updFinal(); return; }
  const w = S.waves[waveIdx];
  if (!lock && w && P.x >= w.at) { lock = true; queue = w.e.slice(); spawnT = 0; goT = 0; }
  if (!lock) return;
  spawnT--;
  const alive = enemies.filter(e => e.state !== 'dead').length;
  if (queue.length && spawnT <= 0 && alive < 4) {
    const t = queue.shift();
    const side = TYPES[t].boss ? 1 : (Math.random() < .5 ? -1 : 1);
    const e = makeEnemy(t, side); enemies.push(e); spawnT = 45;
    if (TYPES[t].boss || Math.random() < .35) say(e, TAUNT[t]);
  }
  if (!queue.length && alive === 0) {
    lock = false;
    if (w.boss) { mode = 'clear'; modeT = 0; SFX.fanfare(); }
    else { waveIdx++; goT = 160; SFX.go(); }
  }
}

function updWorld() {
  // aggro tokens: two nearest melee enemies (and bosses) get to attack
  const act = enemies.filter(e => e.state === 'idle' && !e.T.ranged).sort((a, b) => Math.abs(a.x - P.x) - Math.abs(b.x - P.x));
  act.forEach((e, i) => { e.aggro = i < 2 || e.T.boss; e.slot = i; });
  for (const e of enemies) updEnemy(e);
  // separation
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.state === 'dead' || b.state === 'dead') continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.abs(dx) < 26 && Math.abs(dy) < 12) { const s = dx >= 0 ? 1 : -1; a.x -= s * .8; b.x += s * .8; }
  }
  enemies = enemies.filter(e => !(e.state === 'dead' && e.fade !== undefined && e.fade <= 0));

  for (const pr of projs) {
    pr.x += pr.vx; pr.z += pr.vz;
    if (pr.owner === 'p') {
      pr.vz -= .12; pr.spin += .45;
      for (const e of enemies) {
        if (pr.hit.includes(e) || !hittable(e)) continue;
        if (Math.abs(e.x - pr.x) < 34 && Math.abs(e.y - pr.y) < 24 && pr.z < 110 * (e.T.scale || 1)) {
          pr.hit.push(e);
          hitEnemy(e, { dmg:pr.dmg, down:true, kb:7, weapon:true, armOwner:pr.w.owner || null }, Math.sign(pr.vx));
          if (!pr.pierce) { pr.dead = true; landProj(pr); break; }
        }
      }
      if (!pr.dead && pr.z <= 0) { pr.dead = true; pr.z = 0; landProj(pr); }
    } else {
      pr.spin += .3; pr.life--;
      if (Math.abs(P.x - pr.x) < 22 && Math.abs(P.y - pr.y) < 20 && P.z < 45 && P.inv <= 0 && !['down','special','rip'].includes(P.state)) {
        hurtPlayer(pr.dmg, Math.sign(pr.vx), false); pr.dead = true;
      }
      if (pr.life <= 0) pr.dead = true;
    }
    if (pr.x < camX - 120 || pr.x > camX + W + 120) pr.dead = true;
  }
  projs = projs.filter(p => !p.dead);
}

function updFx() {
  for (const p of parts) {
    p.life--;
    if (p.homing) {                         // blown kiss drifting to Jansen
      const tx = P.x, tz = 85, dx = tx - p.x, dy = P.y - p.y, dz = tz - p.z, d = Math.hypot(dx, dz) || 1;
      p.x += dx / d * 3.2; p.y += dy * .08; p.z += dz / d * 3.2 + Math.sin(p.life * .2) * 1.2;
      if (d < 12) { p.life = 0; P.blush = 100; hearts(P.x, P.y, 85, 6); SFX.kiss(); pop(P.x, P.y, 125, '*BLUSH*', '#ff7ab8', 10); }
      continue;
    }
    if (p.petal) { p.x += p.vx; p.z += Math.sin((p.life + p.x) * .08) * 1.2 - .3; continue; }
    if (p.gpuFly) {                         // floor-end GPUs flying into Jansen's arms
      p.t = (p.t || 0) + 1; if (p.t <= 0) continue;
      const k = Math.min(1, p.t / 40);
      p.x += (P.x - p.x) * k * .25; p.y += (P.y - p.y) * k * .25; p.z = 30 + Math.sin(k * Math.PI) * 120;
      if (p.t >= 40) { p.life = 0; P.gpus++; SFX.pickup(); }
      continue;
    }
    if (p.z > 0 || p.vz > 0) { p.vz -= .35; p.z += p.vz; p.x += p.vx; p.y += p.vy; }
    if (p.z <= 0 && !p.landed) {
      p.z = 0; p.landed = true;
      if (gore && !p.tear && !p.heart && p.c[1] !== 'f' && Math.random() < .5) addDecal(p.x, p.y, rnd(2, 6));
    }
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 1400) parts.splice(0, parts.length - 1400);
  if (P && P.blush > 0) P.blush--;
  if (roastT > 0) roastT--;
  for (const h of heads) {
    if (h.z > 0 || h.vz > 0) { h.vz -= GRAV; h.z += h.vz; h.x += h.vx; h.spin += .35 * Math.sign(h.vx || 1); }
    if (h.z <= 0) { h.z = 0; h.vz = 0; h.vx = 0; h.spin = 0; }
  }
  for (const p of parts) if (p.float) { p.vz = .9; p.z += .6; }
  for (const p of pops) { p.life--; if (!p.bubble) p.z += .6; }
  pops = pops.filter(p => p.life > 0 && (!p.follow || p.follow.state !== 'dead'));
  shake *= .85; if (shake < .4) shake = 0;
  if (flashA > 0) flashA = Math.max(0, flashA - .05);
  if (banner > 0) banner--; if (goT > 0) goT--;
}

function update() {
  updPlayer();
  updWorld();
  updWaves();
  if (!lock) {
    const target = clamp(P.x - W * .4, 0, S.len - W);
    if (target > camX) camX += Math.min(6, target - camX);
  }
}

/* ---------------- drawing primitives ---------------- */
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x * PX, y * PX, w * PX, h * PX); }
function txt(s, x, y, size, col, align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 3); ctx.strokeStyle = '#000';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function bar(x, y, w, h, f, c, bg) {
  ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = c; ctx.fillRect(x, y, Math.max(0, w * clamp(f, 0, 1)), h);
}
function hh(i) { const x = Math.sin(i * 127.1 + stageIdx * 311.7) * 43758.5453; return Math.floor((x - Math.floor(x)) * 1000); }

function drawItem(kind, w) {
  switch (kind) {
    case 'arm':
      R(-1, -1, 3, 3, w.skin); R(-1, 1, 1, 1, w.skin); R(1, 1, 1, 1, w.skin);
      R(-1, -13, 3, 12, w.top); R(-1, -13, 1, 12, w.top2);
      R(-1, -15, 3, 2, gore ? '#b00000' : w.top2);
      if (gore) { R(0, -16, 1, 1, '#eadcc4'); R(1, -14, 1, 2, '#e01818'); }
      break;
    case 'keyboard':
      R(-1, -15, 3, 15, '#2a2a2a'); for (let i = 0; i < 7; i++) R(0, -14 + i * 2, 1, 1, '#a0a0a0');
      R(0, 0, 1, 2, '#555');

function drawBG() {
  const th = S.th;
  ctx.fillStyle = th.wall; ctx.fillRect(0, 0, W, FT);
  ctx.fillStyle = th.wall2; for (let wx = Math.floor(camX / 60) * 60; wx < camX + W; wx += 60) ctx.fillRect(wx - camX, 50, 2, FT - 80);
  ctx.fillStyle = th.ceil; ctx.fillRect(0, 0, W, 46);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 46, W, 4);
  for (let wx = Math.floor(camX / 160) * 160; wx < camX + W + 160; wx += 160) {
    ctx.fillStyle = '#fffbe0'; ctx.fillRect(wx - camX + 40, 38, 80, 6);
  }
  const SEG = 240, i0 = Math.floor(camX / SEG) - 1;
  for (let i = i0; i < i0 + 7; i++) drawProp(hh(i) % 5, i * SEG - camX, i);
  ctx.fillStyle = th.base; ctx.fillRect(0, FT - 34, W, 10);
  ctx.fillStyle = th.floor; ctx.fillRect(0, FT - 24, W, H - FT + 24);
  ctx.fillStyle = th.floor2;
  for (let r = 0; r < 7; r++) ctx.fillRect(0, FT - 24 + r * 34, W, 2);
  for (let wx = Math.floor(camX / 96) * 96; wx < camX + W + 96; wx += 96) {
    const x = wx - camX;
    ctx.beginPath(); ctx.moveTo(x, FT - 24); ctx.lineTo(x + 2, FT - 24); ctx.lineTo(x + 2 + (x - W / 2) * .35, H); ctx.lineTo(x + (x - W / 2) * .35, H); ctx.fill();
  }
  // end-of-floor elevator
  const ex = S.len - 150 - camX;
  if (ex < W + 20 && !S.final) {
    ctx.fillStyle = '#999'; ctx.fillRect(ex, 110, 120, 196);
    ctx.fillStyle = '#bbb'; ctx.fillRect(ex + 6, 116, 52, 190); ctx.fillRect(ex + 62, 116, 52, 190);
    ctx.fillStyle = '#e33'; ctx.fillRect(ex + 52, 92, 16, 12);
    txt('UP', ex + 60, 86, 8, '#fff');
  }
}

function drawScene() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake) * .6);
  if (fin && fin.kissed) {           // slow push-in on the embrace
    const z = 1 + 1.1 * Math.min(1, fin.t / 90), cx = P.x - camX + P.face * 14, cy = P.y - 55;
    ctx.translate(W / 2, H / 2 + 40); ctx.scale(z, z); ctx.translate(-cx, -cy);
  }
  drawBG();
  // blood splattered on the wall, with drips that keep running down
  for (const s of splats) {
    const x = s.x - camX; if (x < -80 || x > W + 80) continue;
    ctx.fillStyle = 'rgba(130,0,0,.85)';
    ctx.beginPath(); ctx.arc(x, s.y, s.r * .7, 0, Math.PI * 2); ctx.fill();
    for (const [bx, by, br] of s.blobs) { ctx.beginPath(); ctx.arc(x + bx, s.y + by, br, 0, Math.PI * 2); ctx.fill(); }
    for (const d of s.drips) { d[1] = Math.min(d[1] + d[2], FT - 34 - s.y); ctx.fillRect(x + d[0], s.y, d[3], d[1]); ctx.fillRect(x + d[0] - 1, s.y + d[1] - 2, d[3] + 2, 3); }
  }
  // romance-novel sunset behind the final embrace
  if (fin && fin.kissed) {
    const a = Math.min(1, fin.t / 40), cx = P.x - camX + P.face * 14;
    const g = ctx.createRadialGradient(cx, P.y - 90, 20, cx, P.y - 90, 420);
    g.addColorStop(0, `rgba(255,236,170,${a})`); g.addColorStop(.35, `rgba(255,140,90,${a * .9})`); g.addColorStop(1, `rgba(120,20,80,${a * .85})`);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  // decals
  for (const d of decals) { ctx.fillStyle = d.c; ctx.beginPath(); ctx.ellipse(d.x - camX, d.y, d.r, d.r * .35, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const h of heads) { if (h.z <= 0) drawSevered(h); }
  // a freshly ripped heart lying on the floor, still beating
  if (P && P.organ && P.organ.x !== undefined && !P.organ.flat) {
    const b = frame % 16 < 5 ? 1 : 0;
    ctx.save(); ctx.translate(P.organ.x - camX, P.organ.y - 6);
    R(-2 - b, -2 - b, 5 + 2 * b, 4 + b, '#c01020'); R(-2 - b, -3 - b, 2, 1, '#c01020'); R(1 + b, -3 - b, 2, 1, '#c01020'); R(-1, -2 - b, 1, 1, '#ff6a7a');
    ctx.restore();
  }
  // floor items
  for (const it of items) {
    const x = it.x - camX; if (x < -60 || x > W + 60) continue;
    drawShadow(it.x, it.y, 0, .7);
    ctx.save(); ctx.translate(x, it.y - 2);
    if (it.kind === 'arm' || it.kind === 'keyboard') { ctx.rotate(Math.PI / 2); ctx.translate(-8, -20); }
    drawItem(it.kind, it); ctx.restore();
    if (it.kind === 'gpu') { if (frame % 40 < 20) { ctx.fillStyle = 'rgba(118,255,3,.25)'; ctx.fillRect(x - 22, it.y - 22, 44, 24); } }
    else if (P && Math.abs(it.x - P.x) < 46 && Math.abs(it.y - P.y) < 30 && !P.weapon && frame % 40 < 28) txt('L', x, it.y - 52, 10, '#ffd84a');
  }
  // entities
  const ents = [...enemies, ...projs];
  if (P && mode !== 'title') ents.push(P);
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) drawShadow(e.x, e.y, e.z, e.T ? (e.T.scale || 1) : .6);
  for (const e of ents) {
    if (e.T) drawFighter(e);
    else { ctx.save(); ctx.translate(e.x - camX, e.y - e.z); ctx.rotate(e.spin); ctx.translate(0, e.kind === 'memo' ? 0 : 20); drawItem(e.kind, e.w || {}); ctx.restore(); }
  }
  for (const h of heads) if (h.z > 0) drawSevered(h);
  // pee streams + censor bars
  for (const a of [P, ...enemies]) if (a && a.peeing) drawPee(a);
  // particles
  for (const p of parts) {
    ctx.fillStyle = p.c;
    if (p.gpuFly) { if (p.t > 0) { ctx.save(); ctx.translate(p.x - camX, p.y - p.z); drawItem('gpu', {}); ctx.restore(); } }
    else if (p.heart) {
      const x = p.x - camX, y = p.y - p.z, k = p.big ? 2 : 1;
      ctx.fillRect(x - 3 * k, y - 2 * k, 3 * k, 3 * k); ctx.fillRect(x + 1 * k, y - 2 * k, 3 * k, 3 * k); ctx.fillRect(x - 2 * k, y, 5 * k, 2 * k); ctx.fillRect(x - 1 * k, y + 2 * k, 3 * k, 2 * k);
    }
    else ctx.fillRect(p.x - camX, p.y - p.z, p.s, p.s);
  }
  // finisher prompts
  if (P && mode === 'play' && !P.weapon) for (const e of enemies) {
    const f = finisher(e);
    if (f && frame % 30 < 20) {
      const y = e.y - e.z - 148 * (e.T.scale || 1);
      txt(f === 'rip' ? 'L: RIP ARM' : 'L: DECAPITATE', e.x - camX, y - 14, 9, '#ff3b3b');
      txt('K: RIP HEART', e.x - camX, y, 9, '#ff7a7a');
    }
  }
  if (fin && fin.phase === 'fight' && P.gpus > 0 && Math.abs(fin.v.x - P.x) < 80 && Math.abs(fin.v.y - P.y) < 30 && frame % 30 < 20)
    txt('L: GIVE GPU', fin.v.x - camX, fin.v.y - 150, 10, '#ff7ab8');
  // popups / bubbles
  for (const p of pops) {
    if (p.bubble) {
      const e = p.follow, sc = e.T.scale || 1, x = e.x - camX, y = e.y - e.z - 120 * sc;
      ctx.font = `8px ${FONT}`; const w = ctx.measureText(p.text).width + 16;
      ctx.fillStyle = '#fff'; ctx.fillRect(x - w / 2, y - 18, w, 24);
      ctx.fillRect(x - 4, y + 6, 8, 6);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x - w / 2, y - 18, w, 24);
      ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.fillText(p.text, x, y - 2);
    } else {
      ctx.globalAlpha = Math.min(1, p.life / 20);
      txt(p.text, clamp(p.x - camX, 200, W - 200), p.y - p.z, p.size, p.color);
      ctx.globalAlpha = 1;
    }
  }
  // roast spotlight while Jansen winds up
  if (P && P.state === 'special' && P.t < 20) {
    const g = ctx.createRadialGradient(P.x - camX, P.y - 50, 40, P.x - camX, P.y - 50, 320);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();
  if (flashA > 0) { ctx.fillStyle = fin && fin.kissed ? `rgba(255,200,230,${flashA})` : `rgba(255,120,60,${flashA * .6})`; ctx.fillRect(0, 0, W, H); }
  // the roast itself, in a giant speech balloon
  if (roastT > 0 && P && mode === 'play') {
    const s = Math.min(1, (170 - roastT) / 8), words = roastText.split(' '), lines = [''];
    for (const w of words) { if ((lines[lines.length - 1] + ' ' + w).length > 26) lines.push(w); else lines[lines.length - 1] += (lines[lines.length - 1] ? ' ' : '') + w; }
    const bw = 640, bh = 34 + lines.length * 30, bx = W / 2 - bw / 2, by = 104;
    ctx.save(); ctx.translate(W / 2, by + bh / 2); ctx.scale(s, s); ctx.translate(-W / 2, -(by + bh / 2));
    ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, bw, bh);
    const px = clamp(P.x - camX, bx + 40, bx + bw - 40);
    ctx.beginPath(); ctx.moveTo(px - 16, by + bh); ctx.lineTo(px + 16, by + bh); ctx.lineTo(px, by + bh + 34); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(bx, by, bw, bh);
    lines.forEach((l, i) => txt(l, W / 2, by + 44 + i * 30, 18, i % 2 ? '#ff3b3b' : '#ffd84a'));
    ctx.restore();
  }
  // romance novel cover framing for the ending
  if (fin && fin.kissed) {
    const a = Math.min(1, fin.t / 60);
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 6; ctx.strokeRect(14, 14, W - 28, H - 28);
    ctx.lineWidth = 2; ctx.strokeRect(24, 24, W - 48, H - 48);
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.font = 'italic bold 52px Georgia, "Times New Roman", serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#5a0a2a'; ctx.strokeText('Hostile Takeover', W / 2, 92);
    const gr = ctx.createLinearGradient(0, 50, 0, 96); gr.addColorStop(0, '#fff4c0'); gr.addColorStop(1, '#ffb000');
    ctx.fillStyle = gr; ctx.fillText('Hostile Takeover', W / 2, 92);
    ctx.font = 'italic 22px Georgia, "Times New Roman", serif'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#5a0a2a'; ctx.lineWidth = 4;
    ctx.strokeText('She wanted his GPUs. He wanted her heart.', W / 2, 126); ctx.fillText('She wanted his GPUs. He wanted her heart.', W / 2, 126);
    ctx.font = 'italic 18px Georgia, "Times New Roman", serif';
    ctx.strokeText('A Clmidia Romance', W / 2, H - 44); ctx.fillText('A Clmidia Romance', W / 2, H - 44);
    ctx.globalAlpha = 1;
  }
}

let levelIdx = 0, scene = 'brawl';
function startGame() { score = 0; lives = 2; P = newPlayer(); P.gpus = 0; endKind = ''; paused = false; levelIdx = 0; mode = 'intro'; modeT = 0; }
function startDemoGame() { score = 0; lives = 2; P = newPlayer(); P.gpus = 0; endKind = ''; paused = false; levelIdx = 1; beginLevel(); banner = 0; }
function beginLevel() {
  const k = LEVELS[levelIdx].key;
  parts = []; pops = []; flashA = 0; shake = 0; paused = false;

      for (let s = 1; s < 6; s++) ctx.lineTo(bx + (s % 2 ? 10 : -10) + rnd(-4, 4), P.y - 150 + s * 14);
      ctx.stroke();
    }
    ctx.fillStyle = '#d6d6d6';
    for (let s = 0; s < 5; s++) { ctx.beginPath(); ctx.moveTo(P.x - 12 + s * 6, P.y - 104); ctx.lineTo(P.x - 9 + s * 6, P.y - 124 - (s % 2) * 6); ctx.lineTo(P.x - 6 + s * 6, P.y - 104); ctx.fill(); }
  }
  if (th.img && th.img.k === 'work' && th.love > .4 && !th.zapped) { heartIcon(P.x - 16, P.y - 94, '#ff2f7a'); }
  drawFxLayer();
  ctx.restore();
  if (flashA > 0) { ctx.fillStyle = `rgba(255,255,170,${flashA})`; ctx.fillRect(0, 0, W, H); }
}
function drawTherapyHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(10, 10, 300, 66);
  txt('MARRIAGE', 22, 34, 10, '#fff', 'left');
  for (let i = 0; i < TH_STRIKES; i++) heartIcon(140 + i * 26, 20, i < TH_STRIKES - th.strikes ? '#ff4f9a' : '#442233');
  txt('SLIDE ' + clamp(th.i + 1, 0, TH_TOTAL) + '/' + TH_TOTAL, 22, 62, 9, '#bbb', 'left');
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(W - 250, 10, 240, 40);
  txt('SCORE ' + score, W - 22, 36, 10, '#fff', 'right');
  txt('ZAP (ANY BUTTON) WHEN HE FALLS FOR WORK. NEVER DURING FAMILY TIME.', W / 2, H - 12, 8, '#fff');
  if (paused) drawPausedOverlay();
}

function drawEnding() {
  if (mode === 'over' && modeT > 20) {
    const again = 'YOU MUST START OVER FROM LEVEL 1.';
    if (endKind === 'vivian') drawEnd('ACQUIRED.', 'ESPIONAGE ALICE NOW OWNS CLMIDIA. AND YOUR HEAD.', '#ff4f9a', again);
    else if (endKind === 'diner') drawEnd("YOU'RE FIRED.", 'THE GRIDDLE HOUSE LETS YOU GO. ' + ((dn && dn.why) || ''), '#ff3b3b', again);
    else if (endKind === 'divorce') drawEnd('DIVORCED.', 'HE LEFT HIS FAMILY FOR A GPU CLUSTER.', '#ff3b3b', again);
    else drawEnd("YOU'RE FIRED.", 'THE BOARD ACCEPTS YOUR RESIGNATION.', '#ff3b3b', again);
  }
  if (mode === 'win') drawEnd('MARRIAGE SAVED', 'FAMILY FIRST. (MOSTLY.) HOSTILE TAKEOVER COMPLETE!', '#76ff03', '"...BUT THAT NEW GPU THOUGH."');
}

/* ---------------- main loop ---------------- */
/* demo mode: a simple bot drives the virtual controller */
function demoBot() {
  keys.left = keys.right = keys.up = keys.down = false;
  if (mode !== 'play') return;
  P.hp = Math.max(P.hp, 50);
  if (demoCd > 0) { demoCd--; return; }
  const live = enemies.filter(e => e.state !== 'dead' && e.state !== 'enter' && !e.T.untouchable)
                      .sort((a, b) => Math.abs(a.x - P.x) - Math.abs(b.x - P.x));
  const e = live[0];
  if (!e) { keys.right = true; return; }
  const dx = e.x - P.x, dy = e.y - P.y;
  if (Math.abs(dx) > 55) keys[dx > 0 ? 'right' : 'left'] = true;
  if (Math.abs(dy) > 8) keys[dy > 0 ? 'down' : 'up'] = true;
  if (Math.abs(dx) <= 62 && Math.abs(dy) <= 10) {
    if ((P.face > 0) !== (dx > 0)) keys[dx > 0 ? 'right' : 'left'] = true;
    if (P.hype >= 100) pressed.special = true;
    else if (finisher(e) && !P.weapon) pressed[Math.random() < .35 ? 'kick' : 'grab'] = true;
    else pressed[Math.random() < .25 ? 'kick' : 'punch'] = true;
    demoCd = 8;
  }
}
function endDemo() { demo = false; mode = 'title'; titleIdle = 0; for (const k in keys) keys[k] = false; }

function step() {
  frame++;
  if (demo) {
    if (anyInput) { anyInput = false; endDemo(); for (const k in pressed) delete pressed[k]; return; }
    demoT++;
    if (demoT > 60 * 75 || (mode !== 'play' && mode !== 'clear')) { endDemo(); return; }
    demoBot();
  }
  anyInput = false;
  if (pressed.gore) { gore = !gore; if (mode === 'play') pop(P.x, P.y, 140, gore ? 'GORE ON' : 'GORE OFF', '#7cf', 12); }
  switch (mode) {
    case 'title':
      if (pressed.start || pressed.punch) { startGame(); titleIdle = 0; }
      else if (Object.keys(pressed).length || Object.values(keys).some(Boolean)) titleIdle = 0;
      else if (++titleIdle > 300) { titleIdle = 0; demo = true; demoT = 0; demoCd = 0; startDemoGame(); }
      break;
    case 'intro':
      modeT++;
      if (modeT > 30 && (pressed.start || pressed.punch || pressed.grab)) beginLevel();
      break;
    case 'play':
      if (pressed.pause) paused = !paused;
      if (!paused) {
        if (hitstop > 0) { hitstop--; updFx(); delete pressed.gore; delete pressed.pause; delete pressed.start; return; } // keep attack inputs buffered through hitstop
        update(); updFx();
      }
      break;
    case 'clear':
      modeT++; updFx();
      for (const e of enemies) updEnemy(e);
      enemies = enemies.filter(e => !(e.state === 'dead' && e.fade !== undefined && e.fade <= 0));
      P.t++;
      // every GPU left on the floor flies to Jansen, then a champagne toast
      if (modeT === 30) {
        const g = items.filter(i => i.kind === 'gpu');
        items = items.filter(i => i.kind !== 'gpu');
        clearGpus = g.length;
        g.forEach((it, i) => parts.push({ x:it.x, y:it.y, z:0, vx:0, vy:0, vz:0, life:999, c:'#76ff03', s:4, gpuFly:true, t:-i * 6 }));
      }
      P.pose = modeT > 90 ? 'toast' : 'idle'; P.face = 1;
      if (modeT === 100) SFX.clink();
      if (modeT === 112) { SFX.clink(); pop(P.x, P.y, 95, 'CHEERS!', '#ffd84a', 18); }
      if (modeT > 100 && modeT < 240 && frame % 3 === 0)
        parts.push({ x:P.x + rnd(-120, 120), y:P.y + rnd(-20, 10), z:rnd(160, 260), vx:rnd(-1, 1), vy:0, vz:rnd(0, 2), life:90, c:pick(['#ffd84a','#ff4fa3','#4fd1ff','#7dff6a','#fff']), s:3 });
      if (modeT > 300 || (modeT > 150 && pressed.start)) {
        parts = parts.filter(p => { if (p.gpuFly) P.gpus++; return !p.gpuFly; });
        nextLevel();
      }
      break;
    case 'diner':
      if (pressed.pause) paused = !paused;
      if (!paused) { updDiner(); updFx(); }
      break;
    case 'dinerCut': updDinerCut(); updFx(); break;
    case 'therapy':
      if (pressed.pause) paused = !paused;
      if (!paused) { updTherapy(); updFx(); }
      break;
    case 'over':
      modeT++; updFx();
      if (modeT > 45 && pressed.start) startGame();
      break;
    case 'win':
      modeT++; updFx();
      if (modeT > 45 && pressed.start) mode = 'title';
      break;
  }
  for (const k in pressed) delete pressed[k];
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (mode === 'title') { drawTitle(); return; }
  if (mode === 'intro') { drawIntro(); return; }
  if (scene === 'diner') { drawDiner(); drawDinerHUD(); }
  else if (scene === 'therapy') { drawTherapy(); drawTherapyHUD(); }
  else {
    drawScene(); drawHUD();
    if (mode === 'clear') {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 150, W, 140);
      txt('FLOOR CLEARED!', W / 2, 200, 28, '#ffd84a');
      if (modeT > 30) txt(clearGpus ? '+' + clearGpus + ' GPU' + (clearGpus > 1 ? 's' : '') + ' GRANTED TO THE CEO' : 'NO GPUs LEFT BEHIND', W / 2, 236, 12, '#76ff03');
      if (modeT > 100) txt('A TOAST: TO THE GPUs, AND TO ME!', W / 2, 270, 11, '#fff');
    }
  }
  drawEnding();
  if (demo) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H - 92, W, 34);
    if (frame % 60 < 40) txt('DEMO - PRESS ANY BUTTON', W / 2, H - 68, 14, '#ffd84a');
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
